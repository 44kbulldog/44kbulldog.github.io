<!DOCTYPE html>
<html>
<head>
    <title>Delon - Developer Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #0b1220;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 5px;
        }

        h2 {
            color: #38bdf8;
            margin-top: 0;
        }

        .card {
            background: #111827;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .repo {
            border-left: 3px solid #38bdf8;
            padding-left: 10px;
            margin-bottom: 10px;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        button {
            padding: 10px 15px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Delon</h1>
        <h2>Software Developer | Python | AI Enthusiast</h2>
        <p>Building real-world software and AI solutions.</p>
    </div>

    <div class="card">
        <h3>🚀 My GitHub Projects</h3>
        <div id="repos">Loading projects...</div>
    </div>

</div>

<script>
fetch("https://api.github.com/users/44kbulldog/repos")
.then(response => response.json())
.then(data => {
    let output = "";

    data.forEach(repo => {
        output += `
            <div class="repo">
                <h4>${repo.name}</h4>
                <p>${repo.description || "No description"}</p>
                <a href="${repo.html_url}" target="_blank">View on GitHub</a>
            </div>
        `;
    });

    document.getElementById("repos").innerHTML = output;
});
</script>

</body>
</html>
